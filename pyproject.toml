[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sniptext"
version = "1.2.1"
description = "Snip a screen region, read the text, copy to clipboard. Clip Desk exports a local ledger."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SnipText Contributors" }]
dependencies = [
  "customtkinter>=5.2.0",
  "mss>=9.0.0",
  "Pillow>=10.0.0",
  "pynput>=1.7.6",
  "pystray>=0.19.5",
  "keyring>=25.0.0",
  "openai>=1.40.0",
  "httpx>=0.27.0",
  "plyer>=2.1.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
local = ["rapidocr-onnxruntime>=1.3.24", "onnxruntime>=1.17.0"]

[project.scripts]
sniptext = "sniptext.app:main"

[tool.setuptools.packages.find]
include = ["sniptext*"]
